<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Legal AI Assistant | Indian Law Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: #0a0a0a;
            height: 100vh;
            overflow: hidden;
            color: #ffffff;
        }

        /* Main layout - sidebar + chat area with reactive slide */
        .app {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: #0a0a0a;
            position: relative;
        }

        /* ========== SIDEBAR - Sliding / Reactive to mouse ========== */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 280px;
            background: #111111;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.5);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        /* Hover trigger area - reactive zone on left edge */
        .sidebar-trigger {
            position: fixed;
            left: 0;
            top: 0;
            width: 12px;
            height: 100vh;
            z-index: 99;
            cursor: ew-resize;
            background: transparent;
            transition: background 0.2s;
        }

        .sidebar-trigger:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* subtle indicator pill when sidebar closed */
        .sidebar-indicator {
            position: fixed;
            left: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 40px;
            background: #f5c518;
            border-radius: 4px;
            z-index: 98;
            pointer-events: none;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .sidebar.open ~ .sidebar-indicator,
        .sidebar.open + .sidebar-indicator {
            opacity: 0;
        }

        /* Close overlay when sidebar open (click outside to close) */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 95;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar-header {
            padding: 20px 16px 12px 16px;
            border-bottom: 1px solid #2a2a2a;
        }

        .new-chat-btn {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #f5c518;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #f5c518;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .new-chat-btn:hover {
            background: #2a2a2a;
            border-color: #ffd700;
            color: #ffd700;
        }

        .new-chat-btn::before {
            content: "+";
            font-size: 1.2rem;
            font-weight: 400;
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
        }

        .conversation-item {
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #cccccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
            word-break: break-word;
            gap: 8px;
        }

        .conversation-item:hover {
            background: #1f1f1f;
        }

        .conversation-item.active {
            background: #1a1a1a;
            font-weight: 500;
            color: #f5c518;
            border-left: 2px solid #f5c518;
        }

        .conv-title {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            pointer-events: none;
        }

        .conv-delete {
            opacity: 0;
            background: transparent;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            color: #888888;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.1s;
            flex-shrink: 0;
            pointer-events: auto;
        }

        .conversation-item:hover .conv-delete {
            opacity: 1;
        }

        .conv-delete:hover {
            color: #f5c518;
            background: #2a2a2a;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid #2a2a2a;
            font-size: 0.7rem;
            color: #888888;
        }

        /* ========== MAIN CHAT AREA ========== */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
            min-width: 0;
            margin-left: 0;
            transition: margin-left 0.25s ease;
        }

        /* Header with menu button */
        .chat-header {
            padding: 16px 28px;
            border-bottom: 1px solid #1f1f1f;
            background: #0a0a0a;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-toggle {
            background: transparent;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: #f5c518;
            padding: 6px 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .menu-toggle:hover {
            background: #1a1a1a;
        }

        .chat-header h1 {
            font-size: 1rem;
            font-weight: 500;
            color: #f5c518;
        }

        /* Messages container - wider layout */
        .messages {
            flex: 1;
            overflow-y: auto;
            background: #0a0a0a;
        }

        /* Increased max-width for better text distribution */
        .messages-wrapper {
            max-width: 1200px;
            width: 90%;
            margin: 0 auto;
            padding: 24px 32px 16px 32px;
        }

        .messages::-webkit-scrollbar {
            width: 5px;
        }
        .messages::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #f5c518;
            border-radius: 10px;
        }

        .message {
            padding: 24px 0;
            border-bottom: 1px solid #1f1f1f;
            animation: fadeIn 0.25s ease;
        }
        .message:last-child {
            border-bottom: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row {
            display: flex;
            gap: 20px;
            width: 100%;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            background: #1a1a1a;
        }
        .user-avatar { 
            background: #1a1a1a;
            color: #f5c518;
        }
        .bot-avatar { 
            background: #1a1a1a;
            color: #f5c518;
        }

        .message-content {
            flex: 1;
            line-height: 1.6;
        }

        .message-text {
            font-size: 1rem;
            color: #ffffff;
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.65;
        }
        .message-text p { margin-bottom: 14px; }
        .message-text p:last-child { margin-bottom: 0; }
        .message-text code {
            background: #1a1a1a;
            padding: 2px 8px;
            border-radius: 6px;
            font-family: monospace;
            color: #f5c518;
            font-size: 0.9rem;
        }
        .message-text pre {
            background: #111111;
            padding: 16px;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid #2a2a2a;
            font-size: 0.9rem;
        }

        .message-meta {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .sources { display: flex; gap: 10px; flex-wrap: wrap; }
        .source-tag {
            background: #1a1a1a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #f5c518;
            border: 0.5px solid #2a2a2a;
        }
        .turn-indicator {
            font-size: 0.65rem;
            color: #888888;
        }

        /* Wider input area */
        .input-area-wrapper {
            flex-shrink: 0;
            background: #0a0a0a;
            border-top: 1px solid #1f1f1f;
            padding: 20px 28px 28px 28px;
        }
        .input-container {
            max-width: 1200px;
            width: 90%;
            margin: 0 auto;
        }
        .input-group {
            display: flex;
            gap: 12px;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 24px;
            padding: 8px 12px 8px 20px;
            transition: 0.2s;
        }
        .input-group:focus-within {
            border-color: #f5c518;
            box-shadow: 0 0 0 2px rgba(245, 197, 24, 0.1);
        }
        #question {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 8px;
            font-size: 1rem;
            outline: none;
            color: #ffffff;
            resize: none;
            font-family: inherit;
            min-height: 28px;
            max-height: 160px;
        }
        #question::placeholder { color: #666666; }
        #sendBtn {
            background: transparent;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            color: #f5c518;
            transition: 0.2s;
        }
        #sendBtn:hover:not(:disabled) {
            background: #1a1a1a;
            color: #ffd700;
        }
        #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }

        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 8px 0;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #f5c518;
            border-radius: 50%;
            animation: typingAnim 1.2s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingAnim {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-7px); opacity: 1; }
        }

        .welcome-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 16px 0 12px;
        }
        .welcome-tag {
            background: #1a1a1a;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #f5c518;
            border: 0.5px solid #2a2a2a;
        }

        /* Responsive adjustments */
        @media (max-width: 900px) {
            .messages-wrapper {
                max-width: 95%;
                width: 95%;
                padding: 20px 20px 16px 20px;
            }
            .input-container {
                max-width: 95%;
                width: 95%;
            }
        }

        @media (max-width: 680px) {
            .messages-wrapper {
                padding: 16px 16px 12px 16px;
            }
            .input-area-wrapper {
                padding: 16px 16px 22px 16px;
            }
            .chat-header {
                padding: 12px 20px;
            }
            .sidebar {
                width: 260px;
            }
            .message-row {
                gap: 12px;
            }
            .avatar {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
            }
            .message-text {
                font-size: 0.95rem;
            }
            .welcome-tag {
                padding: 6px 14px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Sidebar overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <!-- Reactive trigger zone on left edge -->
    <div class="sidebar-trigger" id="sidebarTrigger"></div>
    
    <!-- Visual indicator -->
    <div class="sidebar-indicator" id="sidebarIndicator"></div>
    
    <!-- Sliding Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button id="newChatSidebarBtn" class="new-chat-btn">New chat</button>
        </div>
        <div class="conversation-list" id="conversationList">
            <!-- dynamic list of previous chats -->
        </div>
        <div class="sidebar-footer">
            <span style="font-size: 0.65rem; opacity: 0.6;">Click ✕ on any conversation to delete</span>
        </div>
    </div>

    <!-- Main chat area -->
    <div class="chat-main">
        <div class="chat-header">
            <button class="menu-toggle" id="menuToggleBtn">☰</button>
            <h1>Legal AI Assistant</h1>
        </div>

        <div class="messages" id="messages">
            <div class="messages-wrapper" id="messagesWrapper">
                <!-- Original welcome message preserved -->
            </div>
        </div>

        <div class="input-area-wrapper">
            <div class="input-container">
                <div class="input-group">
                    <textarea id="question" placeholder="Ask me anything about Indian law..." rows="1" autocomplete="off"></textarea>
                    <button id="sendBtn">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ----- Reactive sliding sidebar + individual conversation deletion -----
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const trigger = document.getElementById('sidebarTrigger');
    const menuToggle = document.getElementById('menuToggleBtn');
    const messagesWrapper = document.getElementById('messagesWrapper');
    const questionInput = document.getElementById('question');
    const sendButton = document.getElementById('sendBtn');
    const messagesContainer = document.getElementById('messages');
    const conversationListDiv = document.getElementById('conversationList');

    // Original welcome message HTML - preserved exactly
    const ORIGINAL_WELCOME_HTML = `
        <div class="message bot-message welcome-message">
            <div class="message-row">
                <div class="avatar bot-avatar">AI</div>
                <div class="message-content">
                    <div class="message-text">
                        <p>Hello. I'm your AI legal search assistant for Indian law. I can help with:</p>
                        <div class="welcome-list">
                            <span class="welcome-tag">📜 NDPS Act</span>
                            <span class="welcome-tag">🔍 SOP Crime Scene</span>
                            <span class="welcome-tag">📋 SOP Zero FIR</span>
                            <span class="welcome-tag">📖 Investigation Guidelines</span>
                        </div>
                        <p style="margin-top: 16px;">How may I assist with your legal search today?</p>
                    </div>
                </div>
            </div>
        </div>
    `;

    // Sidebar controls
    function openSidebar() {
        sidebar.classList.add('open');
        overlay.classList.add('active');
    }

    function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
    }

    function toggleSidebar() {
        if (sidebar.classList.contains('open')) {
            closeSidebar();
        } else {
            openSidebar();
        }
    }

    // Mouse hover reactive
    let hoverTimer;
    trigger.addEventListener('mouseenter', () => {
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(() => {
            if (!sidebar.classList.contains('open')) openSidebar();
        }, 120);
    });
    sidebar.addEventListener('mouseleave', () => {
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(() => {
            if (sidebar.classList.contains('open')) closeSidebar();
        }, 200);
    });
    overlay.addEventListener('click', closeSidebar);
    menuToggle.addEventListener('click', toggleSidebar);
    
    // auto-resize textarea
    function autoResizeTextarea() {
        questionInput.style.height = 'auto';
        questionInput.style.height = Math.min(questionInput.scrollHeight, 160) + 'px';
    }
    questionInput.addEventListener('input', autoResizeTextarea);

    // ---------- Conversation storage (only save non-empty conversations) ----------
    let conversations = [];
    let currentConvId = null;
    let sessionId = localStorage.getItem('chat_session_id');
    let conversationTurn = 0;
    let hasMessagesInCurrentConv = false;

    if (!sessionId) {
        sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        localStorage.setItem('chat_session_id', sessionId);
    }

    function loadConversations() {
        const stored = localStorage.getItem('law_conversations');
        if (stored) {
            conversations = JSON.parse(stored);
        } else {
            conversations = [];
            saveConversations();
        }
        
        if (conversations.length > 0 && !currentConvId) {
            currentConvId = conversations[0].id;
            const active = conversations.find(c => c.id === currentConvId);
            if (active) {
                sessionId = active.sessionId;
                localStorage.setItem('chat_session_id', sessionId);
                hasMessagesInCurrentConv = true;
            }
        }
        renderConversationList();
    }

    function saveConversations() {
        localStorage.setItem('law_conversations', JSON.stringify(conversations));
    }

    function renderConversationList() {
        conversationListDiv.innerHTML = '';
        if (conversations.length === 0) {
            const emptyMsg = document.createElement('div');
            emptyMsg.style.padding = '20px 12px';
            emptyMsg.style.textAlign = 'center';
            emptyMsg.style.color = '#666666';
            emptyMsg.style.fontSize = '0.75rem';
            emptyMsg.textContent = 'No conversations yet';
            conversationListDiv.appendChild(emptyMsg);
            return;
        }
        
        [...conversations].reverse().forEach(conv => {
            const item = document.createElement('div');
            item.className = 'conversation-item' + (currentConvId === conv.id ? ' active' : '');
            
            const titleSpan = document.createElement('span');
            titleSpan.className = 'conv-title';
            let displayTitle = conv.title || (conv.lastMessage ? conv.lastMessage.substring(0, 28) : 'Chat');
            if (!displayTitle.trim()) displayTitle = 'Conversation';
            titleSpan.textContent = displayTitle;
            
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = '✕';
            deleteBtn.className = 'conv-delete';
            deleteBtn.title = 'Delete this conversation';
            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteSingleConversation(conv.id);
            });
            
            item.appendChild(titleSpan);
            item.appendChild(deleteBtn);
            
            // Click on the conversation item (not the delete button) switches conversation
            item.addEventListener('click', (e) => {
                // Make sure we're not clicking the delete button
                if (e.target !== deleteBtn && !deleteBtn.contains(e.target)) {
                    switchConversation(conv.id);
                }
            });
            
            conversationListDiv.appendChild(item);
        });
    }

    // Function to reset UI to original welcome message
    function resetToOriginalWelcome() {
        messagesWrapper.innerHTML = ORIGINAL_WELCOME_HTML;
    }

    async function deleteSingleConversation(convId) {
        const convToDelete = conversations.find(c => c.id === convId);
        if (!convToDelete) return;
        
        const wasCurrent = (currentConvId === convId);
        
        conversations = conversations.filter(c => c.id !== convId);
        saveConversations();
        
        if (conversations.length === 0) {
            // No conversations left - reset everything
            currentConvId = null;
            hasMessagesInCurrentConv = false;
            const newSessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
            sessionId = newSessionId;
            localStorage.setItem('chat_session_id', sessionId);
            resetToOriginalWelcome();
            renderConversationList();
            return;
        }
        
        if (wasCurrent) {
            // Switch to the most recent conversation
            const nextConv = conversations[conversations.length - 1];
            if (nextConv) {
                await switchConversation(nextConv.id);
            } else {
                resetToOriginalWelcome();
                currentConvId = null;
                hasMessagesInCurrentConv = false;
                renderConversationList();
            }
        } else {
            renderConversationList();
        }
    }

    async function switchConversation(convId) {
        const conv = conversations.find(c => c.id === convId);
        if (!conv) return;
        
        currentConvId = conv.id;
        sessionId = conv.sessionId;
        localStorage.setItem('chat_session_id', sessionId);
        conversationTurn = 0;
        hasMessagesInCurrentConv = true;
        
        // Reset to original welcome when switching conversations
        resetToOriginalWelcome();
        renderConversationList();
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        
        // Close sidebar on mobile/tablet after selection
        if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
            closeSidebar();
        }
    }

    // Clean new chat - reset to original welcome without any extra messages
    async function createNewChat() {
        const newSessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
        
        currentConvId = null;
        sessionId = newSessionId;
        localStorage.setItem('chat_session_id', sessionId);
        conversationTurn = 0;
        hasMessagesInCurrentConv = false;
        
        // Reset to original welcome message
        resetToOriginalWelcome();
        
        renderConversationList();
        
        if (sidebar.classList.contains('open')) {
            closeSidebar();
        }
    }

    // Save current conversation only if it has messages and not already saved
    function saveCurrentConversationIfNeeded(firstMessageText) {
        if (!hasMessagesInCurrentConv && firstMessageText && firstMessageText.trim()) {
            const newConv = {
                id: 'conv_' + Date.now(),
                title: firstMessageText.length > 30 ? firstMessageText.substring(0, 28) + '…' : firstMessageText,
                sessionId: sessionId,
                createdAt: new Date().toISOString(),
                lastMessage: firstMessageText.substring(0, 40)
            };
            conversations.unshift(newConv);
            currentConvId = newConv.id;
            hasMessagesInCurrentConv = true;
            saveConversations();
            renderConversationList();
        }
    }

    // ---------- Chat logic ----------
    function addMessage(text, isUser = false, sources = [], confidence = null, detectedLang = null, turn = null) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
        const avatar = isUser ? '👤' : 'AI';
        const avatarClass = isUser ? 'user-avatar' : 'bot-avatar';
        let metaHtml = '';
        if (!isUser && sources && sources.length > 0) {
            const sourceTags = sources.slice(0,3).map(s => {
                const sourceText = typeof s === 'string' ? s.substring(0,50) : (s.title || s.path || 'source').substring(0,50);
                return `<span class="source-tag">📖 ${sourceText}</span>`;
            }).join('');
            metaHtml += `<div class="sources">${sourceTags}</div>`;
        }
        if (!isUser && turn !== null && turn > 0) metaHtml += `<div class="turn-indicator">Turn ${turn}</div>`;
        const formattedText = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
        messageDiv.innerHTML = `
            <div class="message-row">
                <div class="avatar ${avatarClass}">${avatar}</div>
                <div class="message-content">
                    <div class="message-text">${formattedText}</div>
                    ${metaHtml ? `<div class="message-meta">${metaHtml}</div>` : ''}
                </div>
            </div>
        `;
        messagesWrapper.appendChild(messageDiv);
        messageDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
        
        if (!isUser) {
            const activeConv = conversations.find(c => c.id === currentConvId);
            if (activeConv) {
                activeConv.lastMessage = text.substring(0, 40);
                saveConversations();
                renderConversationList();
            }
        }
    }

    let typingDiv = null;
    function showTyping() { removeTyping(); typingDiv = document.createElement('div'); typingDiv.className = 'message bot-message'; typingDiv.id = 'typing-indicator'; typingDiv.innerHTML = `<div class="message-row"><div class="avatar bot-avatar">AI</div><div class="message-content"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div></div>`; messagesWrapper.appendChild(typingDiv); messagesContainer.scrollTop = messagesContainer.scrollHeight; }
    function removeTyping() { if(typingDiv){ typingDiv.remove(); typingDiv=null; } }

    async function sendMessage() {
        const question = questionInput.value.trim();
        if (!question) return;
        
        saveCurrentConversationIfNeeded(question);
        
        questionInput.disabled = true;
        sendButton.disabled = true;
        addMessage(question, true);
        questionInput.value = '';
        autoResizeTextarea();
        showTyping();
        
        try {
            const response = await fetch('http://localhost:8000/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: question, session_id: sessionId, clear_history: false })
            });
            if (!response.ok) throw new Error((await response.json().catch(()=>({}))).detail || `HTTP ${response.status}`);
            const data = await response.json();
            removeTyping();
            if (data.session_id && data.session_id !== sessionId) {
                sessionId = data.session_id;
                localStorage.setItem('chat_session_id', sessionId);
                const activeConv = conversations.find(c => c.id === currentConvId);
                if (activeConv) { activeConv.sessionId = sessionId; saveConversations(); }
            }
            if (data.conversation_turn !== undefined) conversationTurn = data.conversation_turn;
            addMessage(data.answer, false, data.sources || [], null, data.detected_language, data.conversation_turn);
        } catch (error) {
            removeTyping();
            addMessage("I'm having trouble connecting to the knowledge base. Please ensure the backend server is running on port 8000.", false);
            console.error('Fetch error:', error);
        } finally {
            questionInput.disabled = false;
            sendButton.disabled = false;
            questionInput.focus();
        }
    }

    // Initialize with original welcome message
    function initialize() {
        loadConversations();
        
        if (conversations.length > 0 && !currentConvId) {
            currentConvId = conversations[0].id;
            const active = conversations.find(c => c.id === currentConvId);
            if (active) {
                sessionId = active.sessionId;
                localStorage.setItem('chat_session_id', sessionId);
                hasMessagesInCurrentConv = true;
            }
        }
        
        // Always start with original welcome message
        resetToOriginalWelcome();
    }

    initialize();

    document.getElementById('newChatSidebarBtn').addEventListener('click', createNewChat);
    sendButton.addEventListener('click', sendMessage);
    questionInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
</script>
</body>
</html>
